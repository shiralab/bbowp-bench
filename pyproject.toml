[project]
name = "bbowp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cmaes>=0.12.0",
    "configspace>=1.2.2",
    "docker>=7.1.0",
    "openai>=2.21.0",
    "optuna>=4.6.0",
    "optunahub>=0.4.0",
    "pandas>=3.0.1",
    "pydantic>=2.12.4",
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.3",
    "smac>=2.3.1",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
]



[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]
torchvision = [
  { index = "pytorch-cpu" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers -W default::UserWarning"
filterwarnings = [
    "default::UserWarning",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

